<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maps with Leaflet</title>
    <link rel="stylesheet" href="leaflet-1.7.1/leaflet.css" />
    <script src="leaflet-1.7.1/leaflet-src.js"></script>
    <script src="leaflet-1.7.1/leaflet-providers.js"></script>
    <script src="leaflet-1.7.1/leaflet-image.js"></script>

    <style>
        body{
            background-color: #333333;
        }
        #map {
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }

        #rasterMap {
            width: 1px;
            height: 1px;
        }

        #targetContainer{
            display: grid;
            width:416px;
            height: 416px;
            grid-template-columns: repeat(4, 4fr);
            place-items: start;
            background-color: bisque;
        }

        #targetContainer_spare{
            display: grid;
            width:208px;
            height: 268px;
            grid-template-columns: repeat(2, 2fr);
            place-items: center;
            background-color: steelblue;
        }


        #puzzleContainer{
            display: grid;
            width:408px;
            height: 408px;
            grid-template-columns: repeat(4, 2fr);
            place-items: start;
            background-color: bisque;
        }

        div.item {
            display: inline-block;
            width: 400px;
            height: 400px;
            margin: 20px;
        }

        div.draggable {
            background-color: #7f7fe9;
        }
        div.non-draggable {
            background-color: #ee15af;
        }

        div.drag-target {
            width: 100px;
            height: 100px;
        }


        #allElements{
            display: grid;
            width:1000px;
            height: 1000px;
            grid-template-columns: repeat(3, 2fr);
            place-items: start;

            gap: 20px;   /* <<< odstęp między dużymi elementami */
        }
    </style>
</head>
<body>
    <div id="allElements">
        <div id="div1">
            <div id="map"></div>
                <button id="getLocation">Get Current Location</button>
                <button id="saveButton">Save Raster Map</button>
                <button id="startPuzzle" disabled>Start Puzzle</button>
            <canvas id="rasterMap"></canvas>

        </div>

        <div id="targetContainer">
            <div id="canvasx" class="drag-target" hidden></div>
        </div>

        <div id="targetContainer_spare">
            <h3>Schowek</h3>
            <br>
            <div id="canvas_s1" class="drag-target" ></div>
            <div id="canvas_s2" class="drag-target" ></div>
            <div id="canvas_s3" class="drag-target" ></div>
            <div id="canvas_s4" class="drag-target" ></div>
        </div>


        <div id="div3">
            <canvas id="fullSizeCanvas" width="400" height="400"></canvas>
        </div>

        <div id="puzzleContainer">
            <canvas id="singleCanvasx" class="item draggable" width="100" height="100" draggable="true" hidden></canvas>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
